services:
  - type: web
    name: social-plus-website
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && node scripts/inject-firebase-config.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: hamdanmustafa840@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
    disk:
      name: social-plus-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
